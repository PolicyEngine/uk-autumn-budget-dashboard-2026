<body>
<header><div class="wrap"><h1>Drill reruns: drill day vs policyengine 6.10.2 <span class="mock">MOCK</span></h1></div></header>
<main class="wrap">
  <p class="lede">Each drill scored mock Budget measures on the day. We reran the same code on today's engine and data.</p>
  <nav class="tabs" id="tabs" role="tablist" aria-label="Drills"></nav>
  <div id="root"></div>
  <div id="tt" role="tooltip" hidden></div>
</main>
<script>
const GH='https://github.com/PolicyEngine/uk-autumn-budget-dashboard-2026';
const README=GH+'/blob/drill-rerun-latest-engine/docs/drill-reruns/2026-10-24/README.md';
const DEC1='Decile 1: policyengine-uk 2.132.4 now counts households with negative income in decile 1, so decile 1 moves even where revenue does not.';
const FUEL='This drill set fuel duty month by month. Today\'s engine ignores month-by-month rates, so only the VAT part is scored.';
const SHORT={mock_nics_threshold_rise:'NI threshold rise',mock_child_benefit_increase:'Child Benefit increase',mock2_employer_ni_threshold:'Employer NI threshold',mock3_lha_30th_percentile:'LHA to 30th percentile',mock4_state_pension_topup_allowance:'State Pension Top-up Allowance'};
const TABS=[['overview','Overview'],['drill1','Drill 1 · 28 Sep'],['drill2','Drill 2 · 5 Oct'],['drill3','Drill 3 · 12 Oct'],['drill4','Drill 4 · 19 Oct']];
const TAB0=new URLSearchParams(location.search).get('tab');
const st={tab:/^drill[1-4]$/.test(TAB0||'')?TAB0:'overview',hideZero:true,q:'',dec:new Set(),fig:new Set()};
let D,BY;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const n2=v=>v==null?'—':(v<0?'−':'')+Math.abs(v).toFixed(2);
const sbn=v=>v==null?'—':(v>0.0049?'+':v<-0.0049?'−':'')+Math.abs(v).toFixed(2);
const fp=p=>p==null?'':Math.abs(p)<0.005?'no change':(p>0?'+':'−')+Math.abs(p).toFixed(Math.abs(p)<1?2:1)+'%';
const gbp=x=>{if(x==null)return '—';const n=Math.round(x);return (n<0?'−':'')+'£'+Math.abs(n).toLocaleString('en-GB')};
const T=(t,f)=>` data-tip="${esc(t)}"${f?' tabindex="0"':''}`;
const ext=(t,u,tp)=>`<a href="${u}" target="_blank" rel="noopener"${tp?T(tp):''}>${esc(t)}</a>`;
const zero=r=>Math.abs(r.old||0)<5e-3&&Math.abs(r.new||0)<5e-3;
const still=rs=>rs.every(r=>Math.abs(r.diff||0)<5e-4);
const cls=r=>r.vs==='closer'||r.vs==='further'?r.vs:'none';
function headline(rs){if(still(rs))return rs.find(r=>!zero(r))||rs[0];let b=null;for(const r of rs){if(zero(r))continue;if(!b||Math.abs(r.diff)>Math.abs(b.diff)+1e-9)b=r}return b||rs[0]}
const short=h=>SHORT[h.id]||h.name;
function status(r){
  if(r.invalid)return 'Not a valid rerun (fuel duty).';
  if(r.limit)return 'Model limitation: not compared with the costing.';
  if(r.vs==='closer')return 'Closer to the official costing than on drill day.';
  if(r.vs==='further')return 'Further from the official costing than on drill day.';
  if(r.vs==='same')return 'Same distance from the official costing.';
  if(r.lfl!=null)return 'Official costing is £0 this year.';
  return 'No official costing.'}
function rowTip(r){const L=[`${r.name} · ${r.fy}`,`Drill day ${n2(r.old)}bn → rerun ${n2(r.new)}bn`,`Change ${sbn(r.diff)}bn`+(r.pct!=null?` (${fp(r.pct)})`:'')];
  if(r.lfl!=null)L.push(`Official (like-for-like) ${n2(r.lfl)}bn`+(r.lfl_src?`, headline static ${n2(r.static)}bn`:''));
  L.push(status(r));return L.join('\n')}
function measuresOf(d){const ids=[...new Set(D.rows.filter(r=>r.drill===d).map(r=>r.id))];return ids.map(id=>BY[id])}
function valid(d){return measuresOf(d).filter(rs=>!rs[0].invalid&&!rs.every(zero))}
function biggest(d){const hs=valid(d).map(headline).filter(h=>h.pct!=null);return hs.reduce((a,b)=>Math.abs(b.pct)>Math.abs(a.pct)?b:a)}
function takeaway(g){
  if(g.max<1)return 'Same data, engine-only change: nothing moved meaningfully.';
  const hs=valid(g.drill).map(headline);const k=hs.filter(h=>h.pct!=null&&Math.abs(h.pct)<5).length;
  const what=g.drill==='1'?'Engine and data both changed (new survey base).':'Engine and data both changed.';
  return what+' '+(k*2>=hs.length?'Most measures moved by under 5%.':'Most measures moved by 5% or more.')}
function chips(g){const isu=g.issue_label==='retro'?'The review written after the drill.':"The drill's instructions and candidate reforms.";

  const dir=r=>{const a=Math.abs(r.diff).toFixed(2);const cost=Math.abs(r.new)>=Math.abs(r.old)?'more':'less';return r.new<0||(r.new===0&&r.old<0)?`rerun costs £${a}bn ${cost}`:`rerun raises £${a}bn ${cost}`};
  const pct=v=>v>=1?Math.round(v)+'%':v<0.005?'0%':v.toFixed(2)+'%';
  const box1=`<div class="card sb"><div class="big">${pct(g.median)}</div><div class="slab">Typical change <span class="yi"${T(`Median absolute change in the size of each measure, rerun vs drill day, over ${g.n} year cells with a drill-day figure of at least £0.01bn (fuel duty excluded). Exact: ${g.median.toFixed(2)}%.`,true)}>ⓘ</span></div><div class="sl">Half the measures moved by less than this.</div></div>`;
  const box2=`<div class="card sb"><div class="big">${pw(b.pct)}</div><div class="slab">Biggest change <span class="yi"${T(`The largest % change in a measure's headline year (the year with the largest £bn move). Largest over all cells: ${g.max.toFixed(1)}%.`,true)}>ⓘ</span></div><div class="sl">${esc(short(b))}, ${b.fy} (${dir(b)})</div></div>`;
  const box3=g.closer==null?`<div class="card sb"><div class="big">—</div><div class="slab">Closer to the official costing</div><div class="sl">No official costings for this drill.</div></div>`
   :`<div class="card sb"><div class="big">${g.closer} of ${g.closer+g.further}</div><div class="slab">Closer to the official costing <span class="yi"${T(`Year cells (one measure in one year) where the rerun is closer to the like-for-like official costing than the drill-day figure was. Denominator: cells that moved closer or further. Unchanged cells, model limitations and fuel duty are not counted.`,true)}>ⓘ</span></div><div class="sl">${g.further} moved further away${same?`; ${same} unchanged`:''}${nc?`; ${nc} not comparable`:''}.</div></div>`;
  const cave=bad.length?`<div class="sec"><div class="sh">Not valid reruns (${bad.length})</div><p class="cl">${esc(FUEL)} ${ext('Details',README,'README: the fuel duty finding')}</p><div class="mcs">${bad.map(mgroup).join('')}</div></div>`:'';
  return `<div class="dhd"><h2>Drill ${g.drill} · ${g.date}</h2>${chips(g)}<p>${esc(takeaway(g))}</p></div>
   <div class="sec"><div class="sh">Summary</div>
    <div class="grid3">
     ${box1}${box2}${box3}
    </div>${bars(g,ok)}</div>
   <div class="sec mcs">${ok.map(mgroup).join('')}</div>
   ${cave}
   <div class="foot"><button data-tab="overview">Sources and method → Overview</button></div>`}
/* ---------- tabs, render ---------- */
function tabs(){const bar=document.getElementById('tabs');bar.innerHTML=TABS.map(([k,l])=>`<button role="tab" class="tab ${st.tab===k?'on':''}" data-tab="${k}" aria-selected="${st.tab===k}" tabindex="${st.tab===k?0:-1}">${l}</button>`).join('');
  const on=bar.querySelector('.tab.on');if(on&&bar.scrollWidth>bar.clientWidth)bar.scrollLeft=Math.max(0,on.offsetLeft-bar.clientWidth/2+on.offsetWidth/2)}
function render(keep){const y=scrollY;hideTip();tabs();const root=document.getElementById('root');
  root.innerHTML=st.tab==='overview'?overview():drillTab(D.drills.find(g=>'drill'+g.drill===st.tab));
  const q=document.getElementById('q');if(q){q.oninput=e=>{st.q=e.target.value;render('q')};document.getElementById('hideZero').onchange=e=>{st.hideZero=e.target.checked;render()}}
  scrollTo(0,y);if(keep==='q'&&q){q.focus();q.setSelectionRange(q.value.length,q.value.length)}}
function setTab(k,focus){st.tab=k;const u=new URL(location);if(k==='overview')u.searchParams.delete('tab');else u.searchParams.set('tab',k);history.replaceState(null,'',u);render();scrollTo(0,0);if(focus)document.querySelector(`.tab[data-tab="${k}"]`)?.focus()}
document.getElementById('tabs').onclick=e=>{const t=e.target.closest('[data-tab]');if(t)setTab(t.dataset.tab)};
document.getElementById('tabs').onkeydown=e=>{const i=TABS.findIndex(t=>t[0]===st.tab);let j=null;if(e.key==='ArrowRight')j=(i+1)%TABS.length;else if(e.key==='ArrowLeft')j=(i-1+TABS.length)%TABS.length;else if(e.key==='Home')j=0;else if(e.key==='End')j=TABS.length-1;if(j==null)return;e.preventDefault();setTab(TABS[j][0],true)};
document.getElementById('root').addEventListener('click',e=>{
  const t=e.target.closest('[data-tab]');if(t){setTab(t.dataset.tab);return}
  const d=e.target.closest('[data-dec]');if(d){const k=d.dataset.dec;st.dec.has(k)?st.dec.delete(k):st.dec.add(k);render();return}
  const f=e.target.closest('[data-fig]');if(f){const k=f.dataset.fig;st.fig.has(k)?st.fig.delete(k):st.fig.add(k);render();return}
  const g=e.target.closest('[data-go]');if(g&&!(ptr!=='mouse'&&tipEl!==g)){const el=document.getElementById('m-'+g.dataset.go);if(el){el.scrollIntoView({behavior:'smooth',block:'start'});el.classList.add('flash');setTimeout(()=>el.classList.remove('flash'),1200)}}});
document.getElementById('root').addEventListener('keydown',e=>{if(e.key!=='Enter')return;const g=e.target.closest('[data-go]');if(g)g.click()});
/* ---------- shared tooltip ---------- */
const tt=document.getElementById('tt');let tipEl=null,ptr='mouse',downTip=null;
function showTip(el){const t=el.getAttribute('data-tip');if(!t)return;tipEl=el;const [h,...rest]=t.split('\n');
  tt.innerHTML=`<b>${esc(h)}</b>${rest.map(l=>`<div>${esc(l)}</div>`).join('')}`;tt.hidden=false;
  const r=el.getBoundingClientRect(),w=tt.offsetWidth,hh=tt.offsetHeight;let x=r.left+r.width/2-w/2;x=Math.max(8,Math.min(x,innerWidth-w-8));
  let y=r.top-hh-8;if(y<8)y=r.bottom+8;if(y+hh>innerHeight-8)y=Math.max(8,innerHeight-hh-8);tt.style.left=x+'px';tt.style.top=y+'px'}
function hideTip(){tt.hidden=true;tipEl=null}
document.addEventListener('pointerdown',e=>{ptr=e.pointerType;downTip=tipEl});
document.addEventListener('keydown',()=>{ptr='keyboard'});
document.addEventListener('mouseover',e=>{if(ptr!=='mouse')return;const el=e.target.closest('[data-tip]');if(el)showTip(el);else if(tipEl)hideTip()});
document.addEventListener('focusin',e=>{const el=e.target.closest('[data-tip]');if(el)showTip(el);else hideTip()});
document.addEventListener('focusout',()=>{if(ptr==='mouse'||ptr==='keyboard')hideTip()});
addEventListener('scroll',()=>{if(tipEl)hideTip()},{passive:true});
document.addEventListener('click',e=>{const el=e.target.closest('[data-tip]');
  if(ptr!=='mouse'&&el&&!el.closest('a')&&!el.matches('[data-go]')){e.preventDefault();e.stopPropagation();if(downTip===el)hideTip();else showTip(el);return}
  if(!el&&tipEl&&ptr!=='mouse')hideTip()},true);
fetch('data.json').then(r=>r.json()).then(j=>{D=j;BY={};j.rows.forEach(r=>(BY[r.id]=BY[r.id]||[]).push(r));render()});
</script>
