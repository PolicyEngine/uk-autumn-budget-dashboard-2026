<body>
<header><div class="wrap">
  <h1>Drill reruns: drill day vs policyengine 6.10.2 <span class="mock">MOCK</span></h1>
</div></header>
<main class="wrap">
  <p class="lede">Each drill scored mock Budget measures on the day. Here we rerun the same code on today's engine and data, and compare the result with the drill-day figure and the official costing.</p>
  <nav class="tabs" id="tabs" role="tablist" aria-label="Drills"></nav>
  <div id="root"></div>
  <div id="tt" role="tooltip" hidden></div>

</main>
<script>
const README='https://github.com/PolicyEngine/uk-autumn-budget-dashboard-2026/blob/drill-rerun-latest-engine/docs/drill-reruns/2026-10-24/README.md';
const BASIS='Different basis: the drill team converted our figure before comparing it with the costing (cash timing, in-year share or fiscal-year proration). The raw figures are not like-for-like, so the row is not coloured or counted. Their converted figure is shown.';
const DEC1='Decile 1: pe-uk 2.132.4 resets negative household income to zero and counts those households in decile 1, so decile 1 moves even where revenue does not. Figures from before and after it are not comparable.';
const FUEL='Not a valid rerun: this drill set fuel duty month by month, and pe-uk 2.132.6 ignores month-dated rates, so the rerun scores only the VAT part of the measure.';
const TAB0=new URLSearchParams(location.search).get('tab');
const isOpen=k=>!st.closed.has(k);
const st={tab:/^drill[1-4]$/.test(TAB0||'')?TAB0:'overview',view:'m',hideZero:true,q:'',closed:new Set()};
let D,BY;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const n2=v=>v==null?'—':(v<0?'−':'')+Math.abs(v).toFixed(2);
const bn=n2;
const sbn=v=>v==null?'—':(v>0.0049?'+':v<-0.0049?'−':'')+Math.abs(v).toFixed(2);
const pc=v=>v==null?'':(v>0.05?'+':v<-0.05?'−':'')+Math.abs(v).toFixed(1)+'%';
const gbp=x=>{if(x==null)return '—';const n=Math.round(x);return (n<0?'−':'')+'£'+Math.abs(n).toLocaleString('en-GB')};
const pct1=x=>x==null?'—':x.toFixed(1)+'%';
const ext=(t,u,tp)=>`<a href="${u}" target="_blank" rel="noopener"${tp?T(tp):''}>${esc(t)}</a>`;
const T=(text,focus)=>` data-tip="${esc(text)}"${focus?' tabindex="0"':''}`;
const zero=r=>Math.abs(r.old||0)<5e-3&&Math.abs(r.new||0)<5e-3;
const cls=r=>r.vs==='closer'||r.vs==='further'?r.vs:'none';
const still=rs=>rs.every(r=>Math.abs(r.diff||0)<5e-4);
function headline(rs){if(still(rs))return rs.find(r=>!zero(r))||rs[0];let b=null;for(const r of rs){if(zero(r))continue;if(!b||Math.abs(r.diff)>Math.abs(b.diff)+1e-9)b=r}return b||rs[0]}
const fp=p=>p==null?'':Math.abs(p)<0.005?'no change':(p>0?'+':'−')+Math.abs(p).toFixed(Math.abs(p)<1?2:1)+'%';
function status(r){
  if(r.invalid)return 'No colour: not a valid rerun (fuel duty).';
  if(r.vs==='closer')return 'Green: the rerun is closer to the official static costing.';
  if(r.vs==='further')return 'Amber: the rerun is further from the official static costing.';
  if(r.vs==='same')return 'Grey: the distance to the official costing is unchanged.';
  if(r.aligned===false)return 'Grey: the costing is on a different basis.';
  if(r.static!=null)return 'Grey: the official costing is £0 this year.';
  return 'Grey: no official costing for this drill or year.'}
const chgTxt=r=>r.pct==null?(Math.abs(r.diff||0)>=5e-3?`${sbn(r.diff)}bn (from £0)`:`${sbn(r.diff)}bn`):`${sbn(r.diff)}bn (${pc(r.pct)})`;
function rowTip(r,first){
  const L=[first||`${r.name} · ${r.fy}`,`Drill-day estimate: ${n2(r.old)}bn`,`Rerun today: ${n2(r.new)}bn`,`Change: ${chgTxt(r)}`];
  if(r.static!=null)L.push(`Official static costing: ${n2(r.static)}bn`);
  if(r.post!=null)L.push(`Post-behavioural costing: ${n2(r.post)}bn`);
  if(r.aligned===false&&!r.invalid)L.push(`Drill team's converted figure: ${n2(r.team)}bn`);

const LEGEND=`<div class="ikey legend"><span>£bn: negative = cost, positive = raises money</span><span><i class="sw" style="background:#22c55e"></i>closer to the official costing</span><span><i class="sw" style="background:#f59e0b"></i>further from it</span><span><i class="sw" style="background:#94a3b8"></i>no like-for-like costing</span><span><i class="mo"></i>drill day → <i class="mn"></i>rerun</span><span><i class="ds2"></i>official static · <i class="dp2"></i>post-behavioural · <i class="dt2"></i>drill team's converted figure</span></div>`;

    document.getElementById('view').onclick=e=>{const v=e.target.dataset.v;if(!v)return;st.view=v;render()};
    document.getElementById('q').oninput=e=>{st.q=e.target.value;render('q')}}
function toggle(k){st.closed.has(k)?st.closed.delete(k):st.closed.add(k);render(k)}
// ---- shared tooltip
const tt=document.getElementById('tt');let tipEl=null,ptr='mouse',downTip=null;
function showTip(el){const t=el.getAttribute('data-tip');if(!t)return;tipEl=el;
  const [h,...rest]=t.split('\n');tt.innerHTML=`<b>${esc(h)}</b>${rest.map(l=>`<div>${esc(l)}</div>`).join('')}`;
  tt.hidden=false;const r=el.getBoundingClientRect(),w=tt.offsetWidth,hh=tt.offsetHeight;
  let x=r.left+r.width/2-w/2;x=Math.max(8,Math.min(x,innerWidth-w-8));
  let y=r.top-hh-8;if(y<8)y=r.bottom+8;if(y+hh>innerHeight-8)y=Math.max(8,innerHeight-hh-8);
  tt.style.left=x+'px';tt.style.top=y+'px'}
function hideTip(){tt.hidden=true;tipEl=null}
document.addEventListener('pointerdown',e=>{ptr=e.pointerType;downTip=tipEl});
document.addEventListener('mouseover',e=>{if(ptr!=='mouse')return;const el=e.target.closest('[data-tip]');if(el)showTip(el);else if(tipEl)hideTip()});
document.addEventListener('focusin',e=>{const el=e.target.closest('[data-tip]');if(el)showTip(el);else hideTip()});
document.addEventListener('focusout',()=>{if(ptr==='mouse'||ptr==='keyboard')hideTip()});
document.addEventListener('keydown',()=>{ptr='keyboard'});
addEventListener('scroll',()=>{if(tipEl)hideTip()},{passive:true});
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-tip]');
  if(ptr!=='mouse'&&el&&!el.closest('a')){e.preventDefault();e.stopPropagation();if(downTip===el)hideTip();else showTip(el);return}
  if(!el&&tipEl&&ptr!=='mouse')hideTip()},true);
// ---- toggles
const root=document.getElementById('root');
document.getElementById('tabs').onclick=e=>{const t=e.target.closest('[data-tab]');if(t)setTab(t.dataset.tab)};
document.getElementById('tabs').onkeydown=e=>{const i=TABS.findIndex(t=>t[0]===st.tab);let j=null;if(e.key==='ArrowRight')j=(i+1)%TABS.length;else if(e.key==='ArrowLeft')j=(i-1+TABS.length)%TABS.length;else if(e.key==='Home')j=0;else if(e.key==='End')j=TABS.length-1;if(j==null)return;e.preventDefault();setTab(TABS[j][0],true)};
root.onclick=e=>{const ob=e.target.closest('.obtn');if(ob){setTab(ob.dataset.tab);return}if(e.target.closest('a'))return;const t=e.target.closest('[data-t]');if(!t)return;toggle(t.dataset.t)};
root.onkeydown=e=>{if(e.key!=='Enter'&&e.key!==' ')return;const t=e.target.closest('[data-t]');if(!t||e.target!==t)return;e.preventDefault();toggle(t.dataset.t)};
let rz;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>D&&render(),200)});
fetch('data.json').then(r=>r.json()).then(j=>{D=j;BY={};j.rows.forEach(r=>(BY[r.id]=BY[r.id]||[]).push(r));render()});
</script>
