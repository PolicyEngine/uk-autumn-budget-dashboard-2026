# Reviewed exceptions. See README.md for the fields.
#
# Each one binds to the artifact's outputs_sha256 and the comparison's
# comparator_sha256: it lapses if the measure is regenerated with different
# outputs or any Treasury figure or mapping behind it changes. Refresh both
# digests (and residual_bn) from reconciliation.json after the final
# regeneration.
- measure_id: household_energy_payment_2026
  fiscal_year: "2026-27"
  residual_bn: 0.656
  explanation_class: devolved
  explanation: >-
    Table 6.1 row 1 (-£2,625m) covers more than the payment we model, £100
    to households in council tax bands A to D in England only. Budget 2026
    paragraph 3.5: "a £2.6 billion Household Energy Payment ... £100 payment
    for households in bands A-D in England from January 2027. The devolved
    governments will receive their share of funding through the Barnett
    formula, which will enable them to provide similar support." Paragraph
    3.6: "this Budget provides £100 million additional funding for local
    authorities in England to provide further targeted support to households
    acutely impacted by rising energy bills, some of whom are in council tax
    bands above A-D." Neither the Barnett share nor the £100m is modelled;
    the policy costings document has no page for this measure, so the split
    of the £2.6bn is not published. Ours, -£1.969bn, is about 20 million
    households at £100 (paragraph 3.5's "up to 20 million households").
    Decided by Vahid, 28 October 2026. Refreshed to the final artifact
    (101a07dc7238a10e).
  reviewer: vahid-ahmadi
  accepted_at: "2026-10-28T17:59:25Z"
  outputs_sha256: f1c12b0b2dff9cdc9e340f2ad59e90ffad2eebb9aa5ac13762127747ac3f2bba
  comparator_sha256: 6c69569b984736453a87ae5751c1fba71799f71c4cba0fce9f07683bab694565
- measure_id: fuel_duty_rise_deferral
  fiscal_year: "2026-27"
  residual_bn: 0.274
  explanation_class: coverage_business
  explanation: >-
    We model households' own petrol and diesel (bound to ONS Consumer
    Trends household road fuel). Table 6.1 row 3's base is "every litre of
    taxable fuel that is made available for use in the UK" (policy
    costings, p. 13), so it also covers vans, lorries, HGVs and business
    use of cars: the model's household duty is £13.4bn in 2026-27 against
    £24bn of fuel duty receipts (EFO October 2026, para 4.29). Row 3 is
    also fuel duty receipts only (OBR Table 1.1, policy tables, -573.8),
    while ours includes the VAT on the duty (-£50m of -£301m), so the
    comparison includes that VAT on our side only; duty alone is -£251m.
    Behaviour does not explain the gap: the costing's pump-price response
    lowers its cost. The costing's pre-measure path also appears to
    differ: a full 5p from 1 January 2027 on about 45bn litres is about
    £555m, matching row 3's -£575m, and EFO para 4.29 has rates
    "unchanged until January 2027"; we model the law, 3p from 1 January
    and 2p from 1 March 2027 (HMRC's amended rates, SI 2026/164 as amended
    by SI 2026/555), about £410m on the same litres. Decided by Vahid,
    28 October 2026; María to co-review.
  reviewer: vahid-ahmadi
  accepted_at: "2026-10-28T17:59:25Z"
  outputs_sha256: 73eea8d5d3519830e4abab84e5ff77d58753050075b92dedb9e62296d282afa6
  comparator_sha256: e85f7b72d99cc233d56f78ef07ce318e6dd090de377518d447cac3d6bcc83621
