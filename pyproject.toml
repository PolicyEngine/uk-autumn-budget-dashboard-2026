[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uk_budget_data"
version = "0.1.0"
description = "Data pipeline and household API for the UK Autumn Budget 2026 dashboard"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "PolicyEngine", email = "hello@policyengine.org" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "policyengine[uk]==6.11.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "h5py>=3.0.0",
    "microdf-python>=0.3.0",
    "pydantic>=2.0.0",
    "openpyxl>=3.1.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",
    "odfpy>=1.4.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-xdist>=3.8.0",
    "hypothesis>=6.100.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
uk-budget-data = "uk_budget_data.cli:main"
uk-budget-api = "uk_budget_data.api:main"

[tool.uv.sources]
# Drill 5 only (this branch never merges): policyengine built from
# PolicyEngine/policyengine.py@324ecad6, the draft certification of the
# Budget pair (policyengine-uk 2.151.0, Microcosm national a6299504). It is
# installed from a wheel, not from git, because policyengine certifies a
# receipt only for an index or archive install, never a VCS one. The wheel
# is vendor/'s, by its URL at the commit that added it, so an image that
# copies only pyproject.toml and uv.lock (Modal's uv_sync) installs it too.
policyengine = { url = "https://raw.githubusercontent.com/PolicyEngine/uk-autumn-budget-dashboard-2026/f8c263fbc96adf343a1fb236c4e97a498c693932/vendor/policyengine-6.11.0-py3-none-any.whl" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
uk_budget_data = ["budget_years.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.black]
line-length = 79
target-version = ["py313"]

[tool.ruff]
line-length = 79
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
