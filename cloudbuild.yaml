# Build and deploy the household API, uk-budget-api-2026.
#
# A new revision takes no traffic until it passes a smoke test on its own
# tagged URL. Normally the "Deploy the household API" workflow runs this.
# By hand, from an up-to-date checkout of main, submit an exact archive of
# a commit on main with THIS checkout's config (never the archive's own: an
# older commit's copy lacks today's safeguards, and the lock below):
#
#   git archive <commit> | tar -x -C <empty dir>
#   gcloud builds submit <dir> --project policyengine-apps \
#     --region europe-west1 \
#     --config cloudbuild.yaml --substitutions _GIT_SHA=<commit>
#
# Only a commit on main is deployed. Only one deploy of this service runs at a time: deploys must be submitted
# to _REGION (gcloud builds submit --region europe-west1), a build anywhere
# else stops before touching the service, and a build that finds another
# deploy running in _REGION stops. The build checks that the uploaded source is exactly
# that public commit (.gcloudignore makes gcloud upload every file), deploys
# the image it built by digest, smoke-tests a tag only this build uses, and
# moves traffic only if traffic has not changed since the build began. The log ends with the allocation it replaced and the command that
# restores it. Creating the service, which must take traffic at once, needs
# _ALLOW_CREATE=true as well.

substitutions:
  _GIT_SHA: ''
  _ALLOW_CREATE: 'false'
  _REPOSITORY: PolicyEngine/uk-autumn-budget-dashboard-2026
  _SERVICE: uk-budget-api-2026
  _REGION: europe-west1
  _IMAGE: europe-west1-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/uk-budget-api-2026

# Marks this build as a deploy of the service, so concurrent deploys and
# rollbacks (cloudbuild-rollback.yaml carries the same tag) see each other.
tags: ['uk-budget-api-2026-deploy']

options:
  logging: CLOUD_LOGGING_ONLY
  # _IMAGE refers to PROJECT_ID. Shell variables below are written $$name
  # so Cloud Build leaves them for bash.
  dynamicSubstitutions: true

steps:
  # One deploy at a time. Builds are listed per location, so a deploy must
  # run in _REGION: a build submitted anywhere else (including the default
  # global location) stops here, before anything can touch the service.
  # Any two overlapping deploys in _REGION then see each other (a build is
  # listed as ongoing from the moment it is queued), so the later one stops
  # before deploying anything.
  - id: exclusive
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    entrypoint: bash
    args:
      - '-c'
      - |
        set -euo pipefail
        if [ "${LOCATION}" != "${_REGION}" ]; then
          echo "Submit deploys with --region ${_REGION}; this build runs in ${LOCATION}" >&2
          exit 1
        fi
        others=$$(gcloud builds list --ongoing --region ${_REGION} \
          --filter="tags='uk-budget-api-2026-deploy' AND id!='${BUILD_ID}'" \
          --format='value(id)')
        if [ -n "$$others" ]; then
          echo "Another deploy is running ($$others); stopping" >&2
          exit 1
        fi

  # The uploaded source must be byte for byte the public commit named, so
  # the commit /api/version reports is the code that was built.
  - id: verify-source
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    entrypoint: bash
    args:
      - '-c'
      - |
        set -euo pipefail
        if ! echo "${_GIT_SHA}" | grep -Eq '^[0-9a-f]{40}$'; then
          echo "_GIT_SHA must be the full commit being deployed" >&2
          exit 1
        fi
        mkdir -p /tmp/commit
        curl -fsSL "https://codeload.github.com/${_REPOSITORY}/tar.gz/${_GIT_SHA}" \
          | tar -xz -C /tmp/commit --strip-components=1
        if ! diff -r --no-dereference /tmp/commit /workspace; then
          echo "The uploaded source is not commit ${_GIT_SHA}" >&2
          exit 1
        fi

  # Only a commit on main is deployed, as the workflow and the rollback
  # pipeline require: verify-source proves the upload is the named commit,
  # not that the commit was reviewed. A history-only clone of the public
  # repository answers it, and is removed again so it never reaches the
  # image's build context (/workspace).
  - id: on-main
    name: 'gcr.io/cloud-builders/git'
    entrypoint: bash
    args:
      - '-c'
      - |
        set -euo pipefail
        git clone --quiet --filter=blob:none --no-checkout --single-branch \
          --branch main "https://github.com/${_REPOSITORY}.git" /workspace/history
        if ! git -C /workspace/history merge-base --is-ancestor "${_GIT_SHA}" main; then
          echo "${_GIT_SHA} is not on main; only a commit on main is deployed" >&2
          exit 1
        fi
        rm -rf /workspace/history

  - id: build
    name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--build-arg'
      - 'GIT_SHA=${_GIT_SHA}'
      - '-t'
      - '${_IMAGE}:${_GIT_SHA}'
      - '.'

  - id: push
    name: 'gcr.io/cloud-builders/docker'
    args: ['push', '${_IMAGE}:${_GIT_SHA}']

  # Deploy by digest: a tag can be moved by another build, a digest cannot.
  - id: resolve-digest
    name: 'gcr.io/cloud-builders/docker'
    entrypoint: bash
    args:
      - '-c'
      - |
        set -euo pipefail
        docker inspect --format '{{index .RepoDigests 0}}' \
          "${_IMAGE}:${_GIT_SHA}" > /workspace/image_ref
        echo "Image $$(cat /workspace/image_ref)"

  - id: deploy-candidate
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    entrypoint: bash
    args:
      - '-c'
      - |
        set -euo pipefail
        image=$$(cat /workspace/image_ref)
        # The whole build id, in base 36 so the tagged hostname fits.
        tag="b$$(python3 -c 'import string, sys, uuid
        n = uuid.UUID(sys.argv[1]).int
        digits = string.digits + string.ascii_lowercase
        out = ""
        while n:
            n, r = divmod(n, 36)
            out = digits[r] + out
        print(out or "0")' "${BUILD_ID}")"
        echo "$$tag" > /workspace/candidate_tag
        # HOUSEHOLD_WORKERS: the worker processes one household calculation
        # uses. Keep it equal to --cpu: more would only share the vCPUs and
        # use more memory.
        common="--image $$image --region ${_REGION} --platform managed \
          --no-invoker-iam-check --memory 2Gi --cpu 2 --timeout 300 \
          --update-env-vars HOUSEHOLD_WORKERS=2 \
          --tag $$tag \
          --labels commit-sha=${_GIT_SHA},gcb-build-id=${BUILD_ID}"
        # A failed lookup stops the build; only a confirmed absence creates.
        found=$$(gcloud run services list --region ${_REGION} \
          --filter="metadata.name=${_SERVICE}" --format='value(metadata.name)')
        if [ "$$found" = "${_SERVICE}" ]; then
          gcloud run services describe ${_SERVICE} --region ${_REGION} \
            --format=json | python3 -c 'import json, sys
        traffic = json.load(sys.stdin)["status"].get("traffic", [])
        live = sorted((t["revisionName"], t["percent"]) for t in traffic
                      if t.get("percent"))
        print(json.dumps(live))' > /workspace/previous_traffic
          gcloud run deploy ${_SERVICE} $$common --no-traffic
        elif [ -z "$$found" ] && [ "${_ALLOW_CREATE}" = "true" ]; then
          echo "[]" > /workspace/previous_traffic
          echo "Creating ${_SERVICE}: its first revision takes traffic at once"
          gcloud run deploy ${_SERVICE} $$common
        else
          echo "${_SERVICE} not found; creating it needs _ALLOW_CREATE=true" >&2
          exit 1
        fi
        # The revision under this build's tag must be this build's, running
        # the image this build pushed.
        revision=$$(gcloud run services describe ${_SERVICE} \
          --region ${_REGION} --format=json | python3 -c 'import json, sys
        tag = sys.argv[1]
        traffic = json.load(sys.stdin)["status"]["traffic"]
        print(next(t["revisionName"] for t in traffic if t.get("tag") == tag))' "$$tag")
        gcloud run revisions describe "$$revision" --region ${_REGION} \
          --format=json | python3 -c 'import json, sys
        revision = json.load(sys.stdin)
        build_id, image = sys.argv[1], sys.argv[2]
        labels = revision["metadata"].get("labels", {})
        if labels.get("gcb-build-id") != build_id:
            sys.exit("the tagged revision belongs to another build")
        digest = revision["status"].get("imageDigest", "")
        if not digest or digest.split("@")[-1] != image.split("@")[-1]:
            sys.exit("the tagged revision runs a different image")' \
          "${BUILD_ID}" "$$image"
        echo "$$revision" > /workspace/candidate_revision
        gcloud run services describe ${_SERVICE} --region ${_REGION} \
          --format=json | python3 -c 'import json, sys
        tag = sys.argv[1]
        traffic = json.load(sys.stdin)["status"]["traffic"]
        print(next(t["url"] for t in traffic if t.get("tag") == tag))' \
          "$$tag" > /workspace/candidate_url
        echo "Candidate $$revision at $$(cat /workspace/candidate_url)"

  # Main's current smoke checker, from a history-only clone of the public
  # repository: only its two modules, which need nothing beyond the
  # standard library, under an empty package. The commit being deployed
  # may be older than main, and its own checker with it.
  - id: trusted-checker
    name: 'gcr.io/cloud-builders/git'
    entrypoint: bash
    args:
      - '-c'
      - |
        set -euo pipefail
        git clone --quiet --filter=blob:none --no-checkout --single-branch \
          --branch main "https://github.com/${_REPOSITORY}.git" /workspace/history
        mkdir -p /workspace/checker
        git -C /workspace/history archive main \
          src/uk_budget_data/deploy_smoke.py src/uk_budget_data/runtime_identity.py \
          | tar -x -C /workspace/checker
        : > /workspace/checker/src/uk_budget_data/__init__.py
        echo "Smoke checker from main at $$(git -C /workspace/history rev-parse main)"

  # What the candidate's image says it is, as data: its identity and the
  # years and policies its calculator covers (deploy_smoke's
  # print_expectations, written out). Nothing here decides pass or fail.
  - id: expectations
    name: 'gcr.io/cloud-builders/docker'
    entrypoint: bash
    args:
      - '-c'
      - |
        set -euo pipefail
        docker run --rm "$$(cat /workspace/image_ref)" uv run --no-sync python -c 'import json
        from uk_budget_data import personal_impact
        from uk_budget_data.runtime_identity import runtime_identity
        print(json.dumps({"identity": runtime_identity(), "years": [str(y) for y in personal_impact.YEARS], "policies": list(personal_impact.POLICY_IDS)}, sort_keys=True))' > /workspace/expectations.json

  # Smoke-test the candidate with main's checker, on plain Python.
  - id: smoke
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    entrypoint: bash
    args:
      - '-c'
      - |
        set -euo pipefail
        cd /workspace/checker/src
        python3 -s -m uk_budget_data.deploy_smoke \
          --base-url "$$(cat /workspace/candidate_url)" \
          --expect-git-sha ${_GIT_SHA} \
          --expectations /workspace/expectations.json

  # Promote only if traffic is still what it was when this build began, so
  # the allocation recorded for rollback is the one actually replaced.
  - id: promote
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    entrypoint: bash
    args:
      - '-c'
      - |
        set -euo pipefail
        candidate=$$(cat /workspace/candidate_revision)
        others=$$(gcloud builds list --ongoing --region ${_REGION} \
          --filter="tags='uk-budget-api-2026-deploy' AND id!='${BUILD_ID}'" \
          --format='value(id)')
        if [ -n "$$others" ]; then
          echo "Another deploy is running ($$others); not promoting" >&2
          exit 1
        fi
        now=$$(gcloud run services describe ${_SERVICE} --region ${_REGION} \
          --format=json | python3 -c 'import json, sys
        traffic = json.load(sys.stdin)["status"].get("traffic", [])
        live = sorted((t["revisionName"], t["percent"]) for t in traffic
                      if t.get("percent"))
        print(json.dumps(live))')
        before=$$(cat /workspace/previous_traffic)
        if [ "$$before" = "[]" ]; then
          # Just created: the only traffic must be this build's revision.
          expected=$$(python3 -c 'import json, sys
        print(json.dumps([[sys.argv[1], 100]]))' "$$candidate")
          if [ "$$now" != "$$expected" ]; then
            echo "Traffic is not this build's new service ($$now); not promoting" >&2
            exit 1
          fi
        elif [ "$$now" != "$$before" ]; then
          echo "Traffic changed during this build ($$before -> $$now); not promoting" >&2
          exit 1
        fi
        gcloud run services update-traffic ${_SERVICE} --region ${_REGION} \
          --to-revisions "$$candidate=100"
        restore=$$(python3 -c 'import json, sys
        print(",".join(f"{r}={p}" for r, p in json.loads(sys.argv[1])))' "$$before")
        echo "Promoted $$candidate replacing $$before"
        if [ -n "$$restore" ]; then
          echo "Roll back with: gcloud run services update-traffic ${_SERVICE} --project ${PROJECT_ID} --region ${_REGION} --to-revisions $$restore"
        fi

images:
  - '${_IMAGE}:${_GIT_SHA}'
