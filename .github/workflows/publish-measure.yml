name: Publish measures (Budget day)

# Budget day, #105: a measure goes live when its pull request merges.
#
# On a push to main that touches the measure registry, this workflow finds
# the measures the push added or changed (the registry on HEAD against
# HEAD^, compared in Python by what each measure is: uk-budget-data
# changed-measures), runs `uk-budget-data publish-measure` for each one in
# parallel, and opens ONE draft data pull request with their rows and a
# summary. Review rows on it are pending; the Reconciler signs them
# (`uk-budget-data sign-pending`) before it merges. Merging deploys, and the
# measure is live. Nothing here signs a row or merges anything.
#
# Runner: one measure peaks at about 5.4 GB for one year and about 20 GB for
# every year (more with results by area, #59), so the compute job runs on the
# organisation's larger runner, one job per measure. Its label comes from the
# `runner` input, else the repository variable PUBLISH_MEASURE_RUNNER, else
# larger-runner. A label the organisation lacks queues until it times out.
#
# Backend: the `backend` input, else the repository variable
# PUBLISH_MEASURE_BACKEND, else `runner`. With `modal`, each matrix job runs
# on a standard runner and sends its measure to Modal (`publish-measure
# --backend modal`, one container per measure), with the organisation
# secrets MODAL_TOKEN_ID and MODAL_TOKEN_SECRET. That needs the
# faster-generation PR (`--backend modal`) and publish-measure wired to it;
# until then the job stops at its first check with an error saying so.
on:
  push:
    branches: [main]
    paths:
      - src/uk_budget_data/reforms.py
  workflow_dispatch:
    inputs:
      measures:
        description: Measure ids, space separated (empty for those the last push to the branch changed)
        required: false
        default: ""
      years:
        description: Years, space separated (empty for every policy year)
        required: false
        default: ""
      runner:
        description: Runner label for the simulations (empty for vars.PUBLISH_MEASURE_RUNNER or larger-runner)
        required: false
        default: ""
      backend:
        description: runner or modal (empty for vars.PUBLISH_MEASURE_BACKEND or runner); modal needs the faster-generation PR
        required: false
        default: ""

permissions: {}

# One run per commit and set of measures: the same work waits, never doubles
# up, while dispatches for different measures on one commit run side by side
# (a group keeps one pending run and cancels an older pending one, so keying
# on the commit alone would drop a queued dispatch). Data PRs go on a branch
# per run, so runs never write to one branch.
concurrency:
  group: publish-measure-${{ github.sha }}-${{ inputs.measures || 'changed' }}
  cancel-in-progress: false

jobs:
  detect:
    name: Find the measures to publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      measures: ${{ steps.ids.outputs.measures }}
      count: ${{ steps.ids.outputs.count }}
      backend: ${{ steps.backend.outputs.backend }}
    steps:
      - name: Backend
        id: backend
        env:
          BACKEND: ${{ inputs.backend || vars.PUBLISH_MEASURE_BACKEND || 'runner' }}
        run: |
          case "${BACKEND}" in
            runner|modal) echo "backend=${BACKEND}" >> "$GITHUB_OUTPUT"; echo "Backend: ${BACKEND}" ;;
            *) echo "::error::backend must be runner or modal, not '${BACKEND}'"; exit 1 ;;
          esac

      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: false

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies (lockfile must be current)
        run: uv sync --locked

      - name: Measure ids
        id: ids
        env:
          INPUT_MEASURES: ${{ inputs.measures }}
        run: |
          if [ -n "${INPUT_MEASURES}" ]; then
            measures=$(python3 -c 'import json, os; print(json.dumps(os.environ["INPUT_MEASURES"].split()))')
          else
            uv run uk-budget-data changed-measures --base HEAD^ --head HEAD > changed.json
            cat changed.json
            measures=$(python3 -c 'import json; print(json.dumps(json.load(open("changed.json"))["changed"]))')
          fi
          echo "measures=${measures}" >> "$GITHUB_OUTPUT"
          echo "count=$(python3 -c 'import json, sys; print(len(json.loads(sys.argv[1])))' "${measures}")" >> "$GITHUB_OUTPUT"
          echo "Measures: ${measures}"

  compute:
    name: Run ${{ matrix.measure }}
    needs: detect
    if: needs.detect.outputs.count != '0'
    # Modal does the computing on its side, so its jobs need only a standard
    # runner. One job per measure; no max-parallel, so the cap is the larger
    # runner's concurrency limit set in the organisation's settings.
    runs-on: ${{ needs.detect.outputs.backend == 'modal' && 'ubuntu-latest' || (inputs.runner || vars.PUBLISH_MEASURE_RUNNER || 'larger-runner') }}
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        measure: ${{ fromJSON(needs.detect.outputs.measures) }}
    env:
      HUGGING_FACE_TOKEN: ${{ secrets.PE_UK_PRIVATE_HF_READ_TOKEN }}
      MEASURE: ${{ matrix.measure }}
      YEARS: ${{ inputs.years }}
      BACKEND: ${{ needs.detect.outputs.backend }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: false

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies (lockfile must be current)
        run: uv sync --locked

      - name: Run the measure's tables
        if: env.BACKEND == 'runner'
        run: |
          years=()
          if [ -n "${YEARS}" ]; then read -r -a years <<< "${YEARS}"; years=(--years "${years[@]}"); fi
          nproc; free -g
          /usr/bin/time -v uv run uk-budget-data publish-measure "${MEASURE}" \
            --rows-dir fragments "${years[@]}"

      # The Modal backend is the faster-generation PR's (`--backend modal`);
      # this only calls it. Stop with a clear error until publish-measure
      # takes the flag, rather than run the measure somewhere else.
      - name: Check the Modal backend is available
        if: env.BACKEND == 'modal'
        env:
          HAS_MODAL: ${{ secrets.MODAL_TOKEN_ID != '' && secrets.MODAL_TOKEN_SECRET != '' }}
        run: |
          if ! uv run uk-budget-data publish-measure --help | grep -q -- '--backend'; then
            echo "::error::backend modal: publish-measure has no --backend option on this commit. It needs the faster-generation PR (generate --backend modal) and publish-measure wired to its runner. Rerun with backend runner."
            exit 1
          fi
          if [ "${HAS_MODAL}" != true ]; then
            echo "::error::backend modal: the MODAL_TOKEN_ID and MODAL_TOKEN_SECRET secrets are not available to this repository."
            exit 1
          fi

      - name: Run the measure's tables on Modal
        if: env.BACKEND == 'modal'
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          years=()
          if [ -n "${YEARS}" ]; then read -r -a years <<< "${YEARS}"; years=(--years "${years[@]}"); fi
          uv run --with modal==1.6.2 uk-budget-data publish-measure "${MEASURE}" \
            --backend modal --rows-dir fragments "${years[@]}"

      - uses: actions/upload-artifact@v4
        with:
          name: fragment-${{ matrix.measure }}
          path: fragments/
          retention-days: 7
          if-no-files-found: error

  data-pr:
    name: Open the data pull request
    needs: [detect, compute]
    # Opens a PR for the measures that ran, even if another one failed;
    # the summary lists only the measures it carries.
    if: ${{ !cancelled() && needs.detect.outputs.count != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    env:
      HAS_APP: ${{ secrets.APP_ID != '' && secrets.APP_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          pattern: fragment-*
          path: fragments
          merge-multiple: true

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: false

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies (lockfile must be current)
        run: uv sync --locked

      - name: Upsert the rows; mark review rows pending
        run: uv run uk-budget-data apply-rows fragments --summary summary.md

      # Last, so no step before it can reach the token. An App token lets
      # the data PR start CI; one opened with the default token does not.
      - name: Mint an App token
        id: app
        if: env.HAS_APP == 'true'
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Open the draft data pull request
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          BRANCH: data/publish-measure-${{ github.run_id }}
          TITLE: "Data: publish ${{ join(fromJSON(needs.detect.outputs.measures), ', ') }}"
          SUMMARY: summary.md
        run: bash scripts/budget_day/open_data_pr.sh
