name: Adopt a policyengine release

# policyengine.py dispatches `policyengine-release` when it releases a newly
# qualified bundle. This workflow installs that release, checks the installed
# wheel's bundle against the dispatch, and opens a DRAFT upgrade pull request.
# It never merges: adopting a release means regenerating and re-gating every
# published measure on the new execution identity first.
on:
  repository_dispatch:
    types: [policyengine-release]
  workflow_dispatch:
    inputs:
      version:
        description: policyengine version to adopt (for example 6.2.7)
        required: true
      bundle_uk_json:
        description: The dispatch payload's bundle.uk object, as JSON
        required: true
      qualification_json:
        description: The dispatch payload's qualification object, as JSON (null for none)
        required: false
        default: "null"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: adopt-policyengine-release
  cancel-in-progress: false

jobs:
  open-upgrade-pr:
    name: Open a draft upgrade PR
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Dispatch values reach the shell only through these variables, never
      # by interpolation into a script.
      PAYLOAD_VERSION: ${{ github.event.client_payload.version }}
      PAYLOAD_BUNDLE_UK_JSON: ${{ toJSON(github.event.client_payload.bundle.uk) }}
      PAYLOAD_QUALIFICATION_JSON: ${{ toJSON(github.event.client_payload.qualification) }}
      INPUT_VERSION: ${{ inputs.version }}
      INPUT_BUNDLE_UK_JSON: ${{ inputs.bundle_uk_json }}
      INPUT_QUALIFICATION_JSON: ${{ inputs.qualification_json }}
      HAS_APP: ${{ secrets.APP_ID != '' && secrets.APP_PRIVATE_KEY != '' }}
    steps:
      - name: Read and validate the release identity
        id: release
        run: |
          version="${PAYLOAD_VERSION:-$INPUT_VERSION}"
          # Bash matches the whole string (grep would match any one line),
          # so a version with a line break cannot add outputs below.
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::the version is not a plain release version"
            exit 1
          fi
          bundle="$PAYLOAD_BUNDLE_UK_JSON"
          if [ -z "$bundle" ] || [ "$bundle" = "null" ]; then
            bundle="$INPUT_BUNDLE_UK_JSON"
          fi
          {
            echo "version=$version"
            echo "branch=adopt/policyengine-$version"
          } >> "$GITHUB_OUTPUT"
          # Parse the bundle before exporting it: only a JSON object goes
          # through, compacted onto one line, so no input can add lines
          # (and so variables) to the job environment.
          if ! bundle=$(printf '%s' "$bundle" | jq -cse 'if length == 1 and (.[0] | type) == "object" then .[0] else error("expected one JSON object") end'); then
            echo "bundle.uk must be exactly one JSON object" >&2
            exit 1
          fi
          printf 'BUNDLE_UK_JSON=%s\n' "$bundle" >> "$GITHUB_ENV"
          qualification="$PAYLOAD_QUALIFICATION_JSON"
          if [ -z "$qualification" ] || [ "$qualification" = "null" ]; then
            qualification="${INPUT_QUALIFICATION_JSON:-null}"
          fi
          # Not -e: null is a valid answer here, and error() still fails.
          if ! qualification=$(printf '%s' "$qualification" | jq -cs 'if length == 1 and ((.[0] | type) == "object" or .[0] == null) then .[0] else error("expected one JSON object or null") end'); then
            echo "qualification must be one JSON object, or null" >&2
            exit 1
          fi
          printf 'QUALIFICATION_JSON=%s\n' "$qualification" >> "$GITHUB_ENV"

      # An App token lets the upgrade PR trigger CI; a PR opened with the
      # default token does not start pull_request workflows.
      - name: Mint an App token
        id: app
        if: env.HAS_APP == 'true'
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v6
        with:
          ref: main
          token: ${{ steps.app.outputs.token || github.token }}

      # Proposes only a release newer than the one main pins. A branch left
      # by a run that pushed but could not open its pull request is rebuilt
      # (with a lease on exactly what was seen there), so a retry recovers.
      - name: Stop if this release is not newer, or is already proposed
        id: dedupe
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          VERSION: ${{ steps.release.outputs.version }}
          BRANCH: ${{ steps.release.outputs.branch }}
        run: |
          # Whether plain version $1 is newer than plain version $2.
          newer() {
            local IFS=.
            local -a a=($1) b=($2)
            local i
            for i in 0 1 2; do
              if (( 10#${a[i]} > 10#${b[i]} )); then return 0; fi
              if (( 10#${a[i]} < 10#${b[i]} )); then return 1; fi
            done
            return 1
          }
          current=$(grep -A1 '^name = "policyengine"$' uv.lock | sed -n 's/^version = "\(.*\)"$/\1/p')
          if ! [[ "$current" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::uv.lock does not pin a plain policyengine version"
            exit 1
          fi
          echo "current=$current" >> "$GITHUB_OUTPUT"
          if ! newer "$VERSION" "$current"; then
            echo "uv.lock pins policyengine $current; $VERSION is not newer, so nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          orphan=""
          if remote=$(git ls-remote --exit-code --heads origin "$BRANCH"); then
            proposals=$(gh pr list --head "$BRANCH" --state all --json number --jq length)
            if [ "$proposals" != "0" ]; then
              echo "Branch $BRANCH already has a pull request; nothing to do."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            orphan="${remote%%[[:space:]]*}"
            echo "::warning::$BRANCH exists with no pull request, left by an incomplete run; rebuilding it"
          fi
          {
            echo "skip=false"
            echo "orphan=$orphan"
          } >> "$GITHUB_OUTPUT"

      - name: Install uv
        if: steps.dedupe.outputs.skip == 'false'
        uses: astral-sh/setup-uv@v8.1.0
        with:
          save-cache: false
          version: "latest"

      - name: Upgrade the bundle through the lockfile
        if: steps.dedupe.outputs.skip == 'false'
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          uv python install 3.13
          sed -i -E "s/\"policyengine\[uk\]>=[0-9.]+\"/\"policyengine[uk]>=$VERSION\"/" pyproject.toml
          grep -q "\"policyengine\[uk\]>=$VERSION\"" pyproject.toml
          uv lock --upgrade-package "policyengine==$VERSION"
          uv sync --locked --extra dev

      - name: Check the installed release against the dispatch
        if: steps.dedupe.outputs.skip == 'false'
        env:
          VERSION: ${{ steps.release.outputs.version }}
          CURRENT: ${{ steps.dedupe.outputs.current }}
        run: >-
          uv run python -m uk_budget_data.bundle_adoption
          --version "$VERSION" --current-version "$CURRENT"
          --bundle-uk-json "$BUNDLE_UK_JSON"
          --qualification-json "$QUALIFICATION_JSON"

      - name: Open the draft pull request
        if: steps.dedupe.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          VERSION: ${{ steps.release.outputs.version }}
          BRANCH: ${{ steps.release.outputs.branch }}
          ORPHAN: ${{ steps.dedupe.outputs.orphan }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add pyproject.toml uv.lock
          git commit -m "Adopt policyengine $VERSION"
          if [ -n "$ORPHAN" ]; then
            # Replace only the incomplete branch the dedupe step saw.
            git push --force-with-lease="refs/heads/$BRANCH:$ORPHAN" origin "$BRANCH"
          else
            git push origin "$BRANCH"
          fi
          # The release page is built from the validated version, never taken
          # from the dispatch. JSON evidence goes in a fenced block with every
          # backtick escaped (still the same JSON), so it cannot end the fence.
          release_url="https://github.com/PolicyEngine/policyengine.py/releases/tag/$VERSION"
          {
            echo "**Draft, opened automatically. Do not merge until every published measure is regenerated and re-gated on this release.**"
            echo
            echo "policyengine.py released \`$VERSION\` ($release_url). The installed wheel's bundle was checked against the release dispatch and matches:"
            echo
            echo '```json'
            printf '%s\n' "$BUNDLE_UK_JSON" | sed 's/`/\\u0060/g'
            echo '```'
            echo
            echo "Qualification reported by the dispatch, and checked:"
            echo
            echo '```json'
            printf '%s\n' "$QUALIFICATION_JSON" | sed 's/`/\\u0060/g'
            echo '```'
            echo
            echo "## Before merging"
            echo
            echo "- [ ] CI is green on this branch (run the CI workflow manually if it did not start)."
            echo "- [ ] Every published measure and combined run is regenerated on this release and staged with \`publish stage --adopt-execution\`."
            echo "- [ ] Reconciliation and responsiveness are re-run for each regenerated artifact."
            echo "- [ ] Approvals are renewed where outputs changed (identical outputs keep theirs)."
            echo "- [ ] The household API is redeployed on this release and the household checks pass on the deployed route."
            echo "- [ ] \`publish check\` passes."
            echo
            echo "If this cannot finish before a publication deadline, stay on the current release. Mixing releases is refused by the publication gate."
          } > "$RUNNER_TEMP/body.md"
          gh pr create --draft --base main --head "$BRANCH" \
            --title "Adopt policyengine $VERSION" \
            --body-file "$RUNNER_TEMP/body.md"
