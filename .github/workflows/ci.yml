name: CI

# Runs on every pull request, whatever its base branch, so stacked PRs are
# checked too. A pull_request run takes this file from the PR's merge commit,
# so a stacked PR picks up this trigger once its base branch contains it.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          save-cache: false
          version: "latest"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies (lockfile must be current)
        run: uv sync --locked --extra dev

      - name: Run tests that need no credentials
        run: uv run pytest tests/ -m "not certified_data"

  certified-data:
    name: Certified data
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Fine-grained, read-only token for the private UK data repository.
      HUGGING_FACE_TOKEN: ${{ secrets.PE_UK_PRIVATE_HF_READ_TOKEN }}
      # Certified-data tests fail, never skip, in this job.
      REQUIRE_CERTIFIED_DATA: "1"
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          save-cache: false
          version: "latest"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies (lockfile must be current)
        run: uv sync --locked --extra dev

      - name: Check access to the bundle's certified data
        run: uv run python -m uk_budget_data.certified_data

      - name: Run certified-data tests
        run: uv run pytest tests/ -m certified_data

  publication-gate:
    name: Publication gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          save-cache: false
          version: "latest"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies (lockfile must be current)
        run: uv sync --locked --extra dev

      # Re-runs every gate over the committed publication manifest: receipts,
      # file digests, certification, responsiveness, completeness,
      # reconciliation and combined-run membership. Passes when there is no
      # manifest yet.
      - name: Check the publication manifest
        run: uv run uk-budget-data publish check

  lint:
    name: Python lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          save-cache: false
          version: "latest"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies (lockfile must be current)
        run: uv sync --locked --extra dev

      - name: Check formatting with black
        run: uv run black --check src/ tests/

      - name: Lint with ruff
        run: uv run ruff check src/ tests/

  app-build:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build

  app-test:
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run test

  app-lint:
    name: Frontend lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
