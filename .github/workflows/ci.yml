name: CI

# Runs on every pull request, whatever its base branch, so stacked PRs are
# checked too. A pull_request run takes this file from the PR's merge commit,
# so a stacked PR picks up this trigger once its base branch contains it.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python-test-parts:
    name: Python tests (${{ matrix.part }})
    runs-on: ubuntu-latest
    # Three parts on three runners at once. Two parts stopped fitting: on 23
    # October, after #90 and #96, "the rest" took 29 of its 30 minutes
    # (1,937 tests, 28:25 of pytest at 4473f83), so the next test added
    # crossed the limit. The model-limit and template files, about half of
    # that part's worker-seconds on CI, now run on their own; data limits
    # took 12 minutes. A test file named in no part runs in "the rest", and
    # tests/test_ci_parts.py checks that the parts partition the suite.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: data limits
            tests: tests/test_data_limits.py tests/test_publication_data_limits.py
          - part: model limits and templates
            tests: >-
              tests/test_vat_model_limit.py
              tests/test_model_limits.py
              tests/test_september_cpi_model_limit.py
              tests/test_pension_credit_model_limit.py
              tests/test_measure_templates.py
              tests/test_uc_health_template.py
              tests/test_measure_template_composition.py
              tests/test_measure_template_round3.py
              tests/test_measure_template_receipt.py
              tests/test_measure_template_age.py
              tests/test_property_band_index.py
              tests/test_native_measure_regressions.py
              tests/test_measure_keys.py
          - part: the rest
            tests: >-
              tests/ --ignore=tests/test_data_limits.py
              --ignore=tests/test_publication_data_limits.py
              --ignore=tests/test_vat_model_limit.py
              --ignore=tests/test_model_limits.py
              --ignore=tests/test_september_cpi_model_limit.py
              --ignore=tests/test_pension_credit_model_limit.py
              --ignore=tests/test_measure_templates.py
              --ignore=tests/test_uc_health_template.py
              --ignore=tests/test_measure_template_composition.py
              --ignore=tests/test_measure_template_round3.py
              --ignore=tests/test_measure_template_receipt.py
              --ignore=tests/test_measure_template_age.py
              --ignore=tests/test_property_band_index.py
              --ignore=tests/test_native_measure_regressions.py
              --ignore=tests/test_measure_keys.py
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          save-cache: false
          version: "latest"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies (lockfile must be current)
        run: uv sync --locked --extra dev

      # Four workers, one per vCPU on GitHub's public-repository runner.
      # loadgroup keeps each xdist_group on one worker, and without the
      # reorder it hands out work in collection order, where tests/conftest.py
      # puts the slow units first: the first four start on separate workers, and
      # the rest follow as each worker's next unit.
      - name: Run tests that need no credentials
        run: >-
          uv run pytest ${{ matrix.tests }} -m "not certified_data"
          -n 4 --dist loadgroup --no-loadscope-reorder --durations=15

  python-tests:
    name: Python tests
    # The required check: it passes only when every part passes. It runs
    # whatever they did (always()), because a skipped job's check counts as
    # passed.
    needs: python-test-parts
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every part passed
        env:
          PARTS: ${{ needs.python-test-parts.result }}
        run: |
          echo "Python test parts: $PARTS"
          test "$PARTS" = success

  public-data-check:
    name: Public data check
    # Every file under public/data is published. This needs no secrets and no
    # microdata, so it runs on every pull request, forks included, and prints
    # file paths and rule names only.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          save-cache: false
          version: "latest"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies (lockfile must be current)
        run: uv sync --locked

      - name: Check every public file
        run: uv run python scripts/check_public_data.py

  certified-data:
    name: Certified data
    # The private-data token is given only to pushes and pull requests from
    # branches of this repository; fork PRs receive no secrets. Never run
    # this workflow on pull_request_target.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Fine-grained, read-only token for the private UK data repository.
      HUGGING_FACE_TOKEN: ${{ secrets.PE_UK_PRIVATE_HF_READ_TOKEN }}
      # Certified-data tests fail, never skip, in this job.
      REQUIRE_CERTIFIED_DATA: "1"
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          save-cache: false
          version: "latest"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies (lockfile must be current)
        run: uv sync --locked --extra dev

      # --also: the certified-data tests also run on policyengine-uk-data's
      # tiny enhanced FRS (tests/publication_support.py's SMALL_DATASET_NAME),
      # a bundle overlay from 6.10.0 that stays in its own repository.
      - name: Check access to the bundle's certified data
        run: >-
          uv run python -m uk_budget_data.certified_data
          --also enhanced_frs_2024_25_tiny

      - name: Run certified-data tests
        run: uv run pytest tests/ -m certified_data

  publication-gate:
    name: Publication gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          save-cache: false
          version: "latest"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies (lockfile must be current)
        run: uv sync --locked --extra dev

      # Re-runs every gate over the committed publication manifest: receipts,
      # file digests, certification, responsiveness, completeness,
      # reconciliation and combined-run membership. Passes when there is no
      # manifest yet.
      - name: Check the publication manifest
        run: uv run uk-budget-data publish check

  lint:
    name: Python lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          save-cache: false
          version: "latest"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies (lockfile must be current)
        run: uv sync --locked --extra dev

      - name: Check formatting with black
        run: uv run black --check src/ tests/

      - name: Lint with ruff
        run: uv run ruff check src/ tests/

  app-build:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
      # The five tabs render on the real data in jsdom (src/tabsSmoke.test.jsx,
      # Frontend tests); this checks the build just made serves the page,
      # each tab's address and every data file they fetch with HTTP 200,
      # under the base path. In this job, so it adds no runner to the queue.
      - name: Serve the build and check the page and its data files
        run: |
          bun run start > next-start.log 2>&1 &
          for _ in $(seq 1 60); do
            curl --silent --output /dev/null http://127.0.0.1:3000/uk/autumn-budget-2026 && break
            sleep 1
          done
          scripts/smoke-built-site.sh http://127.0.0.1:3000/uk/autumn-budget-2026 \
            || { cat next-start.log; exit 1; }

  app-test:
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run test

  app-lint:
    name: Frontend lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
