name: Deploy the household API

# Deploys and rolls back uk-budget-api-2026 (Cloud Run, project
# policyengine-apps, europe-west1) without anyone's laptop. GitHub's OIDC
# token is exchanged for a short-lived credential through Workload Identity
# Federation, for the service account named in the repository variables
# GCP_WORKLOAD_IDENTITY_PROVIDER and GCP_DEPLOY_SERVICE_ACCOUNT.
#
# A deploy runs the same Cloud Build pipeline as a manual deploy
# (cloudbuild.yaml), on an exact archive of a commit on main. The new
# revision takes no traffic until it passes the smoke test on its own tagged
# URL, and traffic moves only if it has not changed since the build began.
# This workflow then checks that the live /api/version names the commit.
#
# A rollback moves all traffic to a revision you name, and checks the live
# /api/version against that revision's commit.
#
# Deploys on every push to main stay off until the repository variable
# API_DEPLOY_ON_PUSH is "true". Until then, run this workflow by hand.

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - .gcloudignore
      - cloudbuild.yaml
      - pyproject.toml
      - uv.lock
      - "src/uk_budget_data/**"
      - "data_inputs/**"
  workflow_dispatch:
    inputs:
      action:
        description: Deploy a commit, or roll back to a revision
        type: choice
        options: [deploy, rollback]
        default: deploy
      commit:
        description: "deploy: the full commit on main to deploy (default: main's head)"
        required: false
        default: ""
      revision:
        description: "rollback: the revision to send all traffic to, e.g. uk-budget-api-2026-00002-abc"
        required: false
        default: ""

permissions:
  contents: read

# One deploy or rollback at a time; cloudbuild.yaml also refuses to run
# beside another deploy of the service.
concurrency:
  group: uk-budget-api-2026-deploy
  cancel-in-progress: false

env:
  PROJECT: policyengine-apps
  REGION: europe-west1
  SERVICE: uk-budget-api-2026

jobs:
  deploy:
    name: Deploy a commit
    if: >-
      (github.event_name == 'push' && vars.API_DEPLOY_ON_PUSH == 'true')
      || (github.event_name == 'workflow_dispatch' && inputs.action == 'deploy')
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
      id-token: write
    env:
      INPUT_COMMIT: ${{ inputs.commit }}
      WIF_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Choose the commit
        id: commit
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Deploys run from main, not $GITHUB_REF"
            exit 1
          fi
          if [ -z "$WIF_PROVIDER" ] || [ -z "$DEPLOY_SERVICE_ACCOUNT" ]; then
            echo "::error::Set the repository variables GCP_WORKLOAD_IDENTITY_PROVIDER and GCP_DEPLOY_SERVICE_ACCOUNT"
            exit 1
          fi
          commit="${INPUT_COMMIT:-$GITHUB_SHA}"
          if ! [[ "$commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Name the full 40-character commit"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$commit" origin/main; then
            echo "::error::$commit is not on main"
            exit 1
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      # The source is an exact archive of the commit: cloudbuild.yaml checks it
      # byte for byte against the public commit before building.
      - name: Submit the build
        id: build
        env:
          COMMIT: ${{ steps.commit.outputs.commit }}
        run: |
          dir=$(mktemp -d)
          git archive "$COMMIT" | tar -x -C "$dir"
          build=$(gcloud builds submit "$dir" --project "$PROJECT" \
            --region "$REGION" --config "$dir/cloudbuild.yaml" \
            --substitutions "_GIT_SHA=$COMMIT" --async --format='value(id)')
          if ! [[ "$build" =~ ^[0-9a-f-]{36}$ ]]; then
            echo "::error::Cloud Build did not return a build id"
            exit 1
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "Build $build: https://console.cloud.google.com/cloud-build/builds;region=$REGION/$build?project=$PROJECT"

      # Waits on the build's status, so the deploy does not depend on
      # permission to stream its logs. The log is shown afterwards if the
      # service account may read it.
      - name: Wait for the build
        env:
          BUILD: ${{ steps.build.outputs.build }}
          POLL_SECONDS: "20"
        run: |
          while :; do
            status=$(gcloud builds describe "$BUILD" --project "$PROJECT" \
              --region "$REGION" --format='value(status)')
            case "$status" in
              SUCCESS) break ;;
              QUEUED|PENDING|WORKING) sleep "$POLL_SECONDS" ;;
              *)
                gcloud builds log "$BUILD" --project "$PROJECT" \
                  --region "$REGION" || echo "(no access to the build log)"
                echo "::error::Build $BUILD ended $status; traffic was not moved by it"
                exit 1
                ;;
            esac
          done
          gcloud builds log "$BUILD" --project "$PROJECT" --region "$REGION" \
            | tail -n 40 || echo "(no access to the build log)"

      - name: Check the live service
        env:
          COMMIT: ${{ steps.commit.outputs.commit }}
        run: |
          url=$(gcloud run services describe "$SERVICE" --project "$PROJECT" \
            --region "$REGION" --format='value(status.url)')
          live=$(curl -fsS --max-time 120 "$url/api/version" \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)["git_sha"])')
          if [ "$live" != "$COMMIT" ]; then
            echo "::error::$url serves $live, not $COMMIT"
            exit 1
          fi
          echo "$url serves $COMMIT"

  rollback:
    name: Roll back to a revision
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'rollback'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      REVISION: ${{ inputs.revision }}
      WIF_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
    steps:
      - name: Check the request
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Rollbacks run from main, not $GITHUB_REF"
            exit 1
          fi
          if [ -z "$WIF_PROVIDER" ] || [ -z "$DEPLOY_SERVICE_ACCOUNT" ]; then
            echo "::error::Set the repository variables GCP_WORKLOAD_IDENTITY_PROVIDER and GCP_DEPLOY_SERVICE_ACCOUNT"
            exit 1
          fi
          if ! [[ "$REVISION" =~ ^uk-budget-api-2026-[0-9]{5}-[a-z0-9]{3}$ ]]; then
            echo "::error::Name a revision of $SERVICE, e.g. $SERVICE-00002-abc"
            exit 1
          fi

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Move all traffic to the revision
        id: move
        run: |
          revision=$(gcloud run revisions describe "$REVISION" \
            --project "$PROJECT" --region "$REGION" --format=json)
          commit=$(printf '%s' "$revision" | python3 -c 'import json, sys
          revision = json.load(sys.stdin)
          labels = revision["metadata"].get("labels", {})
          service = labels.get("serving.knative.dev/service")
          if service != sys.argv[1]:
              sys.exit(f"{sys.argv[2]} belongs to {service}, not {sys.argv[1]}")
          ready = [c for c in revision["status"].get("conditions", [])
                   if c.get("type") == "Ready"]
          if not ready or ready[0].get("status") != "True":
              sys.exit(f"{sys.argv[2]} is not ready")
          print(labels.get("commit-sha", ""))' "$SERVICE" "$REVISION")
          # A deploy in flight would find traffic moved and stop before
          # promoting; refuse instead, so the two never race.
          others=$(gcloud builds list --ongoing --project "$PROJECT" \
            --region "$REGION" --filter="tags='uk-budget-api-2026-deploy'" \
            --format='value(id)')
          if [ -n "$others" ]; then
            echo "::error::A deploy is running ($others); wait for it or cancel it"
            exit 1
          fi
          before=$(gcloud run services describe "$SERVICE" --project "$PROJECT" \
            --region "$REGION" --format=json | python3 -c 'import json, sys
          traffic = json.load(sys.stdin)["status"].get("traffic", [])
          print(",".join("%s=%s" % (t["revisionName"], t["percent"])
                         for t in traffic if t.get("percent")))')
          gcloud run services update-traffic "$SERVICE" --project "$PROJECT" \
            --region "$REGION" --to-revisions "$REVISION=100"
          echo "Moved all traffic to $REVISION (was $before)"
          if [ -n "$before" ]; then
            echo "Undo with this workflow, or: gcloud run services update-traffic $SERVICE --project $PROJECT --region $REGION --to-revisions $before"
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Check the live service
        env:
          COMMIT: ${{ steps.move.outputs.commit }}
        run: |
          url=$(gcloud run services describe "$SERVICE" --project "$PROJECT" \
            --region "$REGION" --format='value(status.url)')
          live=$(curl -fsS --max-time 120 "$url/api/version" \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)["git_sha"])')
          if [ -n "$COMMIT" ] && [ "$live" != "$COMMIT" ]; then
            echo "::error::$url serves $live, not $REVISION's $COMMIT"
            exit 1
          fi
          echo "$url serves $live"
